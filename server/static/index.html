<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelQC</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e2e5ea; --accent:#1f5eff;
          --ok:#15803d; --warn:#b45309; --ko:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10131a; --card:#1a1f2b; --fg:#e8ebf2; --muted:#9aa3b2; --line:#2a3141; } }
  [hidden] { display:none !important }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,sans-serif }
  header { padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:12px; align-items:center }
  header h1 { margin:0; font-size:18px } #who { margin-left:auto; color:var(--muted); font-size:13px }
  main { max-width:1150px; margin:20px auto; padding:0 16px; display:grid; gap:16px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end } label { display:grid; gap:4px; font-size:13px; color:var(--muted) }
  select,input,textarea,button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg) }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer } button.sec { background:transparent; color:var(--fg); border:1px solid var(--line) }
  button:disabled { opacity:.5; cursor:default }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; color:#fff; font-weight:600 }
  .CONFORME { background:var(--ok) } .A_REVOIR { background:var(--warn) } .NON_CONFORME { background:var(--ko) }
  table { width:100%; border-collapse:collapse; font-size:13px } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top }
  tr.click { cursor:pointer } tr.click:hover { background:var(--bg) }
  img.ov { max-width:100%; border:1px solid var(--line); border-radius:8px }
  .crit3 { color:var(--ko); font-weight:600 } .crit2 { color:var(--warn); font-weight:600 }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px } @media (max-width:760px) { .grid2 { grid-template-columns:1fr } }
  .muted { color:var(--muted) } #login { max-width:340px; margin:80px auto }
  .cand { display:flex; gap:8px; align-items:center; margin-top:6px }
</style>
</head>
<body>
<header><h1>LabelQC — contrôle des étiquettes à réception</h1><span id="who"></span><button class="sec" id="logout" hidden>Déconnexion</button></header>

<main id="login" hidden>
  <section class="card"><h2 style="margin-top:0">Connexion</h2>
    <div class="row" style="display:grid">
      <label>Identifiant<input id="lg" autocomplete="username"></label>
      <label>Mot de passe<input id="pw" type="password" autocomplete="current-password"></label>
      <button id="dologin">Se connecter</button><p id="lgmsg" style="color:var(--ko);margin:0"></p>
    </div></section>
</main>

<main id="app" hidden>
  <section class="card">
    <div class="row">
      <label>Scan déposé par le scanner
        <select id="scan"></select></label>
      <button class="sec" id="refresh" title="Actualiser la liste des scans">↻</button>
      <label>ou fichier / photo<input id="file" type="file" accept="image/*,application/pdf"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label>Modèle<select id="modele"></select></label>
      <label>Nom / code (facultatif)<input id="q" placeholder="ex. rustic F701007"></label>
      <button id="go">Contrôler</button>
    </div>
    <p id="msg" class="muted" style="margin:8px 0 0"></p><div id="cands"></div>
  </section>

  <section id="result" class="card" hidden>
    <div class="row" style="align-items:center">
      <h2 style="margin:0">Résultat <span id="statut" class="badge"></span></h2>
      <span id="score" class="muted"></span><span id="modname" class="muted"></span>
      <span style="margin-left:auto"><button class="sec" id="rapport">Rapport PDF</button></span>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div><h3>Étiquette contrôlée — écarts encadrés</h3><img id="ov" class="ov" alt="Écarts"></div>
      <div><h3>Écarts (<span id="n"></span>)</h3>
        <table><thead><tr><th>Crit.</th><th>Type</th><th>Modèle | étiquette</th><th>Attendu</th><th>Trouvé</th></tr></thead><tbody id="ecarts"></tbody></table>
        <h3>Codes-barres</h3><pre id="codes" style="white-space:pre-wrap;font-size:12px"></pre>
        <h3>Décision</h3>
        <label>Commentaire<textarea id="comm" rows="2"></textarea></label>
        <div class="row" style="margin-top:8px"><button id="acc">Accepter</button><button id="ref" class="sec">Refuser</button></div>
        <p id="decmsg" class="muted"></p>
      </div>
    </div>
  </section>

  <section class="card"><h2 style="margin-top:0">Derniers contrôles</h2>
    <table><thead><tr><th>#</th><th>Date</th><th>Opérateur</th><th>Statut</th><th>Score</th></tr></thead><tbody id="hist"></tbody></table></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current = null, me = null;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { showLogin(); throw new Error('Connexion requise'); }
  return r;
}
function showLogin() { me = null; $('app').hidden = true; $('login').hidden = false; $('logout').hidden = true; $('who').textContent = ''; }
async function start() {
  const r = await fetch('/api/moi');
  if (!r.ok) return showLogin();
  me = await r.json();
  $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
  $('who').textContent = `${me.nom || me.login} · ${me.role}`;
  loadModeles(); loadScans(); loadHist();
}
$('dologin').onclick = async () => {
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ login: $('lg').value, password: $('pw').value }) });
  if (!r.ok) { $('lgmsg').textContent = (await r.json()).detail; return; }
  $('pw').value = ''; $('lgmsg').textContent = ''; start();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('dologin').click(); });
$('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); showLogin(); };

async function loadModeles() {
  const r = await (await api('/api/modeles')).json();
  $('modele').innerHTML = '<option value="">Détection automatique (recommandé)</option>' +
    r.map(m => `<option value="${m.id}">${esc(m.nom_produit || m.ref_produit)} · ${esc(m.code_etiquette)} · ${esc(m.fournisseur)}</option>`).join('');
}
async function loadScans() {
  const r = await (await api('/api/scans')).json();
  $('scan').innerHTML = '<option value="">— aucun (utiliser un fichier) —</option>' +
    r.map(s => `<option value="${esc(s.nom)}">${esc(s.nom)} (${new Date(s.date * 1000).toLocaleTimeString()})</option>`).join('');
  if (r.length) $('scan').value = r[0].nom;
}
async function loadHist() {
  const r = await (await api('/api/controles')).json();
  $('hist').innerHTML = r.map(c => `<tr class="click" data-id="${c.id}"><td>${c.id}</td><td>${esc(c.date_heure)}</td><td>${esc(c.utilisateur_id)}</td><td><span class="badge ${c.statut}">${c.statut}</span></td><td>${c.score_global}</td></tr>`).join('');
  document.querySelectorAll('#hist tr').forEach(tr => tr.onclick = async () => show(await (await api('/api/controles/' + tr.dataset.id)).json()));
}
$('refresh').onclick = loadScans;

function show(c) {
  current = c; $('result').hidden = false;
  $('statut').textContent = c.statut; $('statut').className = 'badge ' + c.statut;
  $('score').textContent = `Score ${c.score_global}/100`;
  $('modname').textContent = c.modele_nom ? '· modèle : ' + c.modele_nom : '';
  $('ov').src = `/api/controles/${c.id}/image?t=${Date.now()}`;
  $('n').textContent = c.ecarts.length;
  $('ecarts').innerHTML = c.ecarts.map(e => `<tr><td class="crit${e.criticite}">${e.criticite}</td><td>${esc(e.type_ecart)}</td><td>${/^\d+,\d+,\d+,\d+$/.test(e.zone) ? `<img loading="lazy" style="max-width:170px" src="/api/controles/${c.id}/zone?box=${e.zone}" alt="">` : ''}</td><td>${esc(e.valeur_attendue)}</td><td>${esc(e.valeur_trouvee)}</td></tr>`).join('') || '<tr><td colspan="5">Aucun écart</td></tr>';
  $('codes').textContent = `Modèle : ${(c.codes.modele || []).join(', ') || '—'}\nÉtiquette : ${(c.codes.recu || []).join(', ') || '—'}`;
  $('decmsg').textContent = c.validation ? `Décision enregistrée : ${c.validation.decision} (${c.validation.utilisateur_id}, ${c.validation.date})` : '';
  const locked = !!c.validation;
  $('acc').disabled = $('ref').disabled = locked;
  $('acc').title = me.role === 'operateur' && c.statut !== 'CONFORME' ? 'Réservé aux superviseurs' : '';
  window.scrollTo({ top: $('result').offsetTop - 10, behavior: 'smooth' });
}

async function run(modeleId) {
  const fd = new FormData();
  if (modeleId || $('modele').value) fd.append('modele_id', modeleId || $('modele').value);
  fd.append('q', $('q').value);
  if ($('scan').value) fd.append('scan', $('scan').value);
  else if ($('file').files[0]) fd.append('image', $('file').files[0]);
  else { $('msg').textContent = 'Choisir un scan ou un fichier.'; return; }
  $('go').disabled = true; $('cands').innerHTML = ''; $('msg').textContent = 'Analyse en cours…';
  try {
    const r = await api('/api/controles', { method: 'POST', body: fd });
    if (r.status === 409) {
      const d = (await r.json()).detail;
      $('msg').textContent = d.message;
      $('cands').innerHTML = d.candidats.map(c => `<div class="cand"><button data-id="${c.modele_id}">Utiliser</button> ${esc(c.nom)} <span class="muted">${esc(c.code)} · ressemblance ${c.score}</span></div>`).join('');
      $('cands').querySelectorAll('button').forEach(b => b.onclick = () => run(b.dataset.id));
    } else if (!r.ok) {
      const d = (await r.json()).detail; throw new Error(typeof d === 'string' ? d : JSON.stringify(d));
    } else {
      const c = await r.json(); $('msg').textContent = ''; show(c); loadHist(); loadScans();
    }
  } catch (e) { $('msg').textContent = 'Erreur : ' + e.message; }
  $('go').disabled = false;
}
$('go').onclick = () => run();

async function decide(decision) {
  const r = await api(`/api/controles/${current.id}/validation`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ decision, commentaire: $('comm').value }) });
  if (!r.ok) { $('decmsg').textContent = (await r.json()).detail; return; }
  show(await r.json()); loadHist();
}
$('acc').onclick = () => decide('ACCEPTE'); $('ref').onclick = () => decide('REFUSE');
$('rapport').onclick = () => window.open(`/api/controles/${current.id}/rapport`, '_blank');
start();
</script>
</body>
</html>
